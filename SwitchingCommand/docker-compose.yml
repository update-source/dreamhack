version: "3.9"
services:
  app:
    build: .
    ports:
      - "8001:80"
    environment:
      XDEBUG_MODE: debug
      # Change client_host to your physical Windows Wi-Fi IPv4 address
      XDEBUG_CONFIG: "client_host=192.168.110.85 client_port=9003 start_with_request=yes"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

  db:
    image: mariadb:lts
    command: --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: dreamhack
      MYSQL_USER: dreamhack
      MYSQL_PASSWORD: dreamhack
      MYSQL_ROOT_PASSWORD: S5tr0ng_Passw0rd1234!@#
    volumes:
      - ./deploy/mysql_init:/docker-entrypoint-initdb.d/
    restart: unless-stopped
